<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zadigital - Solusi Digital Terpercaya</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

    :root {
      --brand-primary: #0a1645;
      --brand-accent: #0eeef7;
      --brand-secondary: #126bdd;
      --bg-color: #0a1645;
      --surface-color: #0d1f5c;
      --text-color: #f0f4ff;
      --border-color: rgba(255, 255, 255, 0.1);

      /* seluruh warna semantic (driven-sheet) */
      --overlay-color: rgba(0, 0, 0, 0.8);
      --muted-contrast: rgba(255, 255, 255, 0.08);

      --status-success: #22c55e;
      --status-success-soft: rgba(34, 197, 94, 0.1);
      --status-danger: #ef4444;
      --status-danger-soft: rgba(239, 68, 68, 0.1);
      --status-warning: #f59e0b;
      --status-warning-soft: rgba(245, 158, 11, 0.1);

      --channel-wa: #25d366;
      --channel-wa-soft: rgba(37, 211, 102, 0.1);
      --channel-rating: #facc15;

      --badge-hot: #f97316;
      --badge-default: #3b82f6;
    }

    * { scrollbar-width: none; -ms-overflow-style: none; }
    *::-webkit-scrollbar { display: none; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: background-color 0.3s, color 0.3s;
      overflow-x: hidden;
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    .tech-grid {
      background-image:
        linear-gradient(to right, var(--brand-accent) 1px, transparent 1px),
        linear-gradient(to bottom, var(--brand-accent) 1px, transparent 1px);
      background-size: 30px 30px;
      opacity: 0.05;
      mask-image: radial-gradient(ellipse at center, black, transparent 80%);
    }

    .loader-wrapper {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--brand-primary);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.5s ease-out;
    }

    .service-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px -5px rgba(0,0,0,0.3); }

    @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    .marquee-container { overflow: hidden; white-space: nowrap; position: relative; }
    .marquee-content { display: inline-flex; animation: marquee 100s linear infinite; }
    .marquee-container:hover .marquee-content { animation-play-state: paused; }

    @keyframes logo-jump { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .logo-jump { animation: logo-jump 3s ease-in-out infinite; }
  </style>
</head>
<body class="dark min-h-screen">

  <div id="popup-promo" class="fixed inset-0 z-[100] hidden items-center justify-center p-6 bg-[var(--overlay-color)] backdrop-blur-sm">
    <div class="bg-[var(--surface-color)] border border-[var(--border-color)] rounded-2xl p-4 max-w-md w-full relative shadow-2xl overflow-hidden">
      <button onclick="closePopup()" class="absolute top-2 right-2 p-2 bg-[var(--muted-contrast)] text-[var(--text-color)] rounded-full z-10 hover:opacity-80 transition-all"><i data-lucide="x" class="w-4 h-4"></i></button>
      <div id="popup-content">
        <img id="popup-image-display" src="" alt="Promo" class="w-full h-auto rounded-xl object-cover" />
      </div>
    </div>
  </div>

  <div id="loading-screen" class="loader-wrapper">
    <div class="w-12 h-12 border-2 border-[var(--muted-contrast)] border-t-[var(--brand-accent)] rounded-full animate-spin mb-4"></div>
    <h1 id="loading-brand-name" class="text-[var(--text-color)] text-lg font-black tracking-widest animate-pulse uppercase">MEMUAT...</h1>
  </div>

  <!-- ... BAGIAN HTML LAIN TETAP SAMA ... -->
  <!-- PENTING: ganti semua hardcoded warna seperti red/green/yellow/pink/orange/blue/white/black menjadi var(...) -->

  <script>
    const BRANDING_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSAizylMKs6s8kFexM7WFO0Y4rhJRUfL8JZsUaCJTFXx0lTGP59wFAdJk0hqAqEfkgKR9fNazaF2D7M/pub?gid=0&single=true&output=csv';
    const DATA_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSAizylMKs6s8kFexM7WFO0Y4rhJRUfL8JZsUaCJTFXx0lTGP59wFAdJk0hqAqEfkgKR9fNazaF2D7M/pub?gid=388669273&single=true&output=csv';
    const TESTIMONY_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSAizylMKs6s8kFexM7WFO0Y4rhJRUfL8JZsUaCJTFXx0lTGP59wFAdJk0hqAqEfkgKR9fNazaF2D7M/pub?gid=1350731658&single=true&output=csv';

    let appData = { branding: {}, services: [], testimonials: [], cart: JSON.parse(sessionStorage.getItem('cart') || '[]'), filters: { platform: 'Semua', search: '', sort: 'default', page: 1 } };
    const ITEMS_PER_PAGE = 20;

    const hexToRgb = (hex) => {
      if (!hex) return null;
      let c = hex.trim().replace('#', '');
      if (c.length === 3) c = c.split('').map(x => x + x).join('');
      if (c.length !== 6) return null;
      const n = parseInt(c, 16);
      if (Number.isNaN(n)) return null;
      return `${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}`;
    };

    const setColor = (root, varName, value, fallback) => {
      root.style.setProperty(varName, value || fallback);
    };

    const setColorWithSoft = (root, varName, softVarName, value, fallback, alpha = 0.1) => {
      const finalVal = value || fallback;
      root.style.setProperty(varName, finalVal);
      const rgb = hexToRgb(finalVal);
      if (rgb) root.style.setProperty(softVarName, `rgba(${rgb}, ${alpha})`);
    };

    const applyColors = () => {
      const b = appData.branding;
      const root = document.documentElement;
      const isDark = document.body.classList.contains('dark');

      setColor(root, '--brand-primary', b.color_default, '#0a1645');
      setColor(root, '--brand-accent', b.color_accent, '#0eeef7');
      setColor(root, '--brand-secondary', b.color_secondary, '#126bdd');

      if (isDark) {
        setColor(root, '--bg-color', b.color_dark_bg, '#0a1645');
        setColor(root, '--surface-color', b.color_dark_surface, '#0d1f5c');
        setColor(root, '--text-color', b.color_dark_text, '#f0f4ff');
        if (b.color_dark_accent) root.style.setProperty('--brand-accent', b.color_dark_accent);
      } else {
        setColor(root, '--bg-color', b.color_light_bg, '#f6f8ff');
        setColor(root, '--surface-color', b.color_light_surface, '#ffffff');
        setColor(root, '--text-color', b.color_light_text, '#0a1645');
        if (b.color_light_accent) root.style.setProperty('--brand-accent', b.color_light_accent);
      }

      /* tambahan agar semua warna driven-sheet */
      setColor(root, '--overlay-color', b.color_overlay, 'rgba(0,0,0,0.8)');
      setColor(root, '--muted-contrast', b.color_muted, 'rgba(255,255,255,0.08)');

      setColorWithSoft(root, '--status-success', '--status-success-soft', b.color_success, '#22c55e');
      setColorWithSoft(root, '--status-danger', '--status-danger-soft', b.color_danger, '#ef4444');
      setColorWithSoft(root, '--status-warning', '--status-warning-soft', b.color_warning, '#f59e0b');

      setColorWithSoft(root, '--channel-wa', '--channel-wa-soft', b.color_whatsapp, '#25d366');
      setColor(root, '--channel-rating', b.color_rating, '#facc15');

      setColor(root, '--badge-hot', b.color_badge_hot, '#f97316');
      setColor(root, '--badge-default', b.color_badge_default, '#3b82f6');
    };

    /* di renderServices ganti badge dan status jadi variable */
    const renderServices = (services) => {
      const grid = document.getElementById('services-grid');
      if (services.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-16 text-center opacity-30 font-black italic">TIDAK ADA DATA</div>`;
        return;
      }

      grid.innerHTML = services.map(s => {
        const isOut = s.stok?.toLowerCase() === 'habis';
        const cPrice = parseInt((s.harga || '').toString().replace(/[^0-9]/g, '')) || 0;
        const badgeBg = s.badge?.includes('Terlaris') ? 'var(--badge-hot)' : 'var(--badge-default)';
        const dotColor = isOut ? 'var(--status-danger)' : 'var(--status-success)';
        const textColor = isOut ? 'var(--status-danger)' : 'var(--status-success)';

        return `<div class="service-card group bg-[var(--surface-color)] border border-[var(--border-color)] rounded-xl p-5 flex flex-col shadow-sm transition-all duration-300">
          <div class="flex justify-between items-start mb-4">
            <div class="w-10 h-10 rounded-lg bg-[var(--brand-accent)]/10 flex items-center justify-center text-[var(--brand-secondary)]"><i data-lucide="globe" class="w-5 h-5"></i></div>
            ${s.badge ? `<span class="px-2.5 py-1 rounded-full text-[8px] font-black uppercase tracking-widest text-white shadow-lg" style="background:${badgeBg}">${s.badge}</span>` : ''}
          </div>
          <h3 class="text-lg font-black mb-1 leading-tight italic uppercase tracking-tighter">${s.nama_layanan}</h3>
          <div class="mb-4"><span class="text-lg font-black text-[var(--brand-secondary)]">${new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',minimumFractionDigits:0}).format(cPrice)}</span></div>
          <div class="mt-auto pt-4 border-t border-[var(--border-color)] flex items-center justify-between gap-3">
            <div class="flex items-center gap-1.5"><div class="w-2 h-2 rounded-full" style="background:${dotColor}"></div><span class="text-[8px] font-black uppercase" style="color:${textColor}">${s.stok || 'AKTIF'}</span></div>
            <button onclick="addToCart('${s.nama_layanan}', ${cPrice})" ${isOut ? 'disabled' : ''} class="flex-1 py-2 px-3 rounded-lg font-black text-[9px] bg-[var(--brand-primary)] text-[var(--text-color)] hover:scale-105 active:scale-95 transition-all disabled:opacity-20 uppercase tracking-tighter">+ KE KERANJANG</button>
          </div>
        </div>`;
      }).join('');

      lucide.createIcons();
    };

    /* di renderTestimonials ganti bintang kuning */
    const renderTestimonials = () => {
      const marquee = document.getElementById('testimonial-marquee');
      const data = appData.testimonials.length > 0 ? [...appData.testimonials, ...appData.testimonials] : [];
      marquee.innerHTML = data.map(t => `<div class="p-6 bg-[var(--bg-color)] rounded-xl border border-[var(--border-color)] shadow-sm min-w-[300px] md:min-w-[350px]">
        <div class="flex gap-1 mb-3">${Array(parseInt(t.bintang || 5)).fill(0).map(() => `<i data-lucide="star" class="w-3 h-3" style="fill:var(--channel-rating);color:var(--channel-rating)"></i>`).join('')}</div>
        <p class="text-xs italic mb-4 opacity-60 leading-relaxed font-bold whitespace-normal">"${t.isi}"</p>
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-[var(--brand-secondary)] to-[var(--brand-accent)] flex items-center justify-center text-[var(--text-color)] font-black text-xs">${t.nama?.charAt(0) || '?'}</div>
          <div><h4 class="font-black text-[10px] uppercase">${t.nama}</h4><span class="text-[7px] opacity-40 uppercase font-black tracking-widest">${t.platform_order}</span></div>
        </div>
      </div>`).join('');
      lucide.createIcons();
    };
  </script>
</body>
</html>
